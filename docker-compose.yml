services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sentinelops
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sentinelops -d sentinelops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://sentinelops:${POSTGRES_PASSWORD}@db:5432/sentinelops
      JWT_SECRET: ${JWT_SECRET}
      SENTINELOPS_EXTERNAL_TOOL_SECRET: ${SENTINELOPS_EXTERNAL_TOOL_SECRET}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - backend

volumes:
  postgres_data:
